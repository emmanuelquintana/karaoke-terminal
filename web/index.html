<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal Karaoke · Visual</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <!-- Fondo animado: portada con ken-burns + blobs de color de la paleta -->
  <div class="bg-layer">
    <div id="bgImage" class="bg-image"></div>
    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>
    <div class="bg-blob blob3"></div>
    <div class="bg-blob blob4"></div>
  </div>
  <div class="bg-tint"></div>
  <!-- Marco/viñeta que oscurece los bordes de TODA la pantalla -->
  <div class="vignette"></div>

  <main class="stage">
    <!-- Barra de búsqueda -->
    <header class="searchbar" id="searchbar">
      <div class="search-fields glass">
        <input id="artist" type="text" placeholder="Artista" autocomplete="off" spellcheck="false" />
        <span class="dot">·</span>
        <input id="title" type="text" placeholder="Canción" autocomplete="off" spellcheck="false" />
      </div>
      <button id="loadBtn" class="load-btn">
        <span class="load-label">Cargar</span>
        <span class="spinner" hidden></span>
      </button>
      <div class="font-picker" id="fontPicker">
        <button id="fontBtn" class="font-toggle glass" title="Fuente de la letra" aria-haspopup="listbox" aria-expanded="false">
          <span class="ic-font">Aa</span>
          <span id="fontCurrent" class="font-current">Inter</span>
          <span class="caret">▾</span>
        </button>
        <div class="font-menu glass" id="fontMenu" hidden></div>
      </div>
      <button id="fsBtn" class="icon-btn glass" title="Pantalla completa (F)">
        <svg class="ic-fs-open" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="ic-fs-close" viewBox="0 0 24 24" hidden><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </header>

    <!-- Pantalla de bienvenida -->
    <section id="welcome" class="welcome">
      <div class="welcome-glow"></div>
      <h1>Terminal&nbsp;Karaoke</h1>
      <p>Escribe un artista y una canción para encender el escenario.</p>
      <p class="suggest-label">O prueba con una sugerencia:</p>
      <div class="suggestions" id="suggestions"></div>

      <!-- Preview de cómo se ve la experiencia -->
      <div class="preview">
        <div class="preview-card glass">
          <div class="preview-cover">♪</div>
          <div class="preview-meta">
            <strong>Tu canción</strong>
            <span>Tu artista</span>
            <i class="preview-bar"><b></b></i>
          </div>
        </div>
        <div class="preview-lyrics">
          <p>Una vista previa</p>
          <p>de cómo se ve la letra</p>
          <p>iluminándose contigo</p>
        </div>
      </div>
    </section>

    <!-- Reproductor -->
    <section id="player" class="player" hidden>
      <!-- Carátula + mini-player -->
      <aside class="now-playing glass">
        <div class="cover-wrap">
          <img id="cover" class="cover" alt="" />
          <div class="cover-fallback" id="coverFallback">♪</div>
        </div>

        <div class="meta">
          <h2 id="songTitle" class="song-title"></h2>
          <p id="songArtist" class="song-artist"></p>
          <span id="songMode" class="badge"></span>
        </div>

        <div class="seek">
          <span id="curTime" class="time">0:00</span>
          <div class="track" id="track">
            <div class="track-fill" id="trackFill"></div>
            <div class="track-knob" id="trackKnob"></div>
          </div>
          <span id="durTime" class="time">0:00</span>
        </div>

        <div class="controls">
          <button id="backBtn" class="ctrl ghost" title="Retroceder 5s">⟲</button>
          <button id="playBtn" class="ctrl play" title="Reproducir / Pausar">
            <svg viewBox="0 0 24 24" class="ic-play"><path d="M8 5v14l11-7z"/></svg>
            <svg viewBox="0 0 24 24" class="ic-pause" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            <span class="ic-loading" hidden></span>
          </button>
          <button id="fwdBtn" class="ctrl ghost" title="Adelantar 5s">⟳</button>
        </div>

        <div class="volume">
          <span class="vol-ic">🔊</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" />
        </div>
        <p id="audioNote" class="audio-note" hidden></p>
      </aside>

      <!-- Letra -->
      <div class="lyrics-pane">
        <div id="lyrics" class="lyrics"></div>
        <div class="fade-top"></div>
        <div class="fade-bottom"></div>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <!-- Filtro de refracción "Liquid Glass": deforma el fondo que pasa por el vidrio -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="liquidGlass" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="1.4" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="34" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <script src="/web/app.js"></script>
</body>
</html>
