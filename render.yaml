services:
  - type: web
    name: karaoke-api
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
