services:
  - type: web
    name: karaoke-api
    runtime: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /api/v1/health
    disk:
      name: karaoke-media
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
